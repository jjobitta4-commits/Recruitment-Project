<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Open Vacancies — RecruitHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="global-navbar">
    <nav class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="nav-brand">
          <div class="brand-badge">R</div>
          <span>RecruitHub</span>
        </a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="jobs.html" class="active">Find Jobs</a></li>
        </ul>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-secondary btn-sm">Log In</a>
          <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
        </div>
      </div>
    </nav>
  </div>

  <!-- Search & Filter Header -->
  <section style="background: var(--surface); border-bottom: 1px solid var(--border); padding: 2.5rem 0 2rem 0;">
    <div class="container">
      <h2 class="mb-1">Explore Open Tech Careers</h2>
      <p class="text-muted mb-3">Find and apply for top developer, engineering, and tech roles worldwide.</p>

      <!-- Filter Controls Bar -->
      <div class="card" style="padding: 1.25rem; background: var(--surface-alt); border-radius: var(--radius);">
        <div class="form-row" style="grid-template-columns: 2fr 1fr 1fr 1.5fr auto;">
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Search Keywords</label>
            <input type="text" id="search-keyword" class="form-control" placeholder="Title, company, or description...">
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Job Type</label>
            <select id="filter-type" class="form-control">
              <option value="all">All Types</option>
              <option value="Full Time">Full Time</option>
              <option value="Part Time">Part Time</option>
              <option value="Internship">Internship</option>
              <option value="Contract">Contract</option>
              <option value="Remote">Remote</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Experience</label>
            <select id="filter-exp" class="form-control">
              <option value="all">All Levels</option>
              <option value="0">Freshers / 0-1 Yr</option>
              <option value="1">1 - 3 Years</option>
              <option value="3">3 - 5 Years</option>
              <option value="5">5+ Years</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Skill</label>
            <input type="text" id="filter-skill" class="form-control" placeholder="e.g. Java, MySQL, React...">
          </div>

          <div class="form-group" style="margin-bottom: 0; display: flex; align-items: flex-end;">
            <button id="btn-reset-filters" class="btn btn-secondary btn-block">Reset</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Jobs Grid Section -->
  <main class="container" style="padding: 3rem 1.5rem;">
    <div class="flex justify-between items-center mb-3">
      <div class="font-bold" id="jobs-count-display" style="font-size: 1.15rem; color: var(--secondary);">Loading Jobs...</div>
    </div>

    <div class="job-grid" id="jobs-grid-container">
      <!-- Injected via jobs.js -->
    </div>
  </main>

  <!-- Modal 1: Job Details Modal -->
  <div class="modal-overlay" id="job-detail-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">Job Details</div>
        <button class="modal-close" onclick="closeModal('job-detail-modal')">&times;</button>
      </div>
      <div class="modal-body" id="job-detail-content">
        <!-- Content dynamic -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('job-detail-modal')">Close</button>
        <button class="btn btn-outline" id="modal-job-gap-trigger" style="border-color: #8b5cf6; color: #7c3aed;">📊 Skill Gap &amp; Roadmap</button>
        <button class="btn btn-primary" id="modal-job-apply-trigger">Apply for this Job</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Apply for Job Modal -->
  <div class="modal-overlay" id="job-apply-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="apply-modal-job-title">Apply for Job</div>
        <button class="modal-close" onclick="closeModal('job-apply-modal')">&times;</button>
      </div>
      <form id="job-apply-form">
        <div class="modal-body">
          <div class="form-row mb-2">
            <div class="form-group">
              <label class="form-label">Applicant Name</label>
              <input type="text" id="apply-name" class="form-control" readonly style="background: #f1f5f9;">
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" id="apply-email" class="form-control" readonly style="background: #f1f5f9;">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Cover Letter / Note to Hiring Manager</label>
            <textarea id="apply-cover-letter" name="coverLetter" class="form-control" rows="4" placeholder="Highlight relevant skills, achievements, and why you are excited for this role..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Attach Resume (PDF)</label>
            <label class="file-upload-box" for="apply-resume-file" style="padding: 1rem;">
              <div style="font-size: 1.5rem;">📄</div>
              <div id="apply-resume-label" class="font-semibold text-primary" style="font-size: 0.9rem;">Upload Custom PDF Resume (Optional)</div>
              <div class="text-muted" style="font-size: 0.75rem;">If omitted, your profile resume on file will be used.</div>
              <input type="file" id="apply-resume-file" name="resume" accept=".pdf,application/pdf">
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('job-apply-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Application</button>
        </div>
      </form>
    </div>
  <!-- Modal 3: Skill Gap Analyzer & Learning Roadmap Modal -->
  <div class="modal-overlay" id="skill-gap-modal">
    <div class="modal-box" style="max-width: 860px;">
      <div class="modal-header">
        <div class="modal-title">🎯 Smart Skill Gap Audit &amp; Personalized Roadmap</div>
        <button class="modal-close" onclick="closeModal('skill-gap-modal')">&times;</button>
      </div>
      <div class="modal-body" id="skill-gap-modal-content">
        <!-- Populated dynamically via skill-gap.js -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('skill-gap-modal')">Close</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container text-center">
      <p>&copy; 2026 RecruitHub — Core Java + JDBC Recruitment System</p>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/skill-gap.js"></script>
  <script src="js/jobs.js"></script>
</body>
</html>
